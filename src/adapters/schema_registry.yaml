      - "flow timestamp"
    label_candidates:
      - "label"
    dst_port_candidates:
      - "dst port"
      - "destination port"
      - "dport"
    field_mappings:
      duration_col: "flow duration"
      src_bytes_col: "totlen fwd pkts"
      dst_bytes_col: "totlen bwd pkts"
      src_pkts_col: "tot fwd pkts"
      dst_pkts_col: "tot bwd pkts"
      iat_mean_col: "flow iat mean"
      iat_std_col: "flow iat std"
      packet_rate_col: "flow pkts/s"
      syn_flag_col: "syn flag cnt"
      ack_flag_col: "ack flag cnt"
      fwd_win_col: "init fwd win byts"
