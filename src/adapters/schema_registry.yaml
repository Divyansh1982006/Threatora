      - "cse-cic-ids2018"
      - "cic-ids2018"
      - "cicids2018"
      - "ids2018"
    signatures:
      - "flow duration"
      - "tot fwd pkts"
      - "tot bwd pkts"
      - "flow byts/s"
      - "flow pkts/s"
      - "init fwd win byts"
    identity_columns:
