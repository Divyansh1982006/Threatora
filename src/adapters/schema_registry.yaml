# Dynamic Canonical Feature Adapter - Schema Registry
# Maps heterogeneous flow schemas to 16 canonical continuous slots:
# [duration_norm, byte_ratio, packet_rate, iat_mean, iat_std, ttl_mean, ttl_variance, tcp_syn_ratio, tcp_ack_ratio, tcp_window_norm, is_privileged_port, payload_entropy, tcp_rst_ratio, fwd_bwd_packet_ratio, payload_bytes_mean, iat_max_norm]

canonical_slots:
  - duration_norm
  - byte_ratio
  - packet_rate
  - iat_mean
  - iat_std
  - ttl_mean
  - ttl_variance
  - tcp_syn_ratio
  - tcp_ack_ratio
  - tcp_window_norm
  - is_privileged_port
  - payload_entropy
  - tcp_rst_ratio
  - fwd_bwd_packet_ratio
  - payload_bytes_mean
  - iat_max_norm

datasets:
  unsw_nb15:
    name: "UNSW-NB15"
    aliases:
      - "unsw"
      - "unsw_nb15"
      - "unsw-nb15"
    signatures:
      - "sbytes"
      - "dbytes"
      - "sttl"
      - "dttl"
      - "swin"
      - "dwin"
      - "sintpkt"
    identity_columns:
      - "srcip"
      - "dstip"
      - "sport"
      - "dsport"
      - "flow_id"
      - "id"
      - "timestamp"
      - "stime"
      - "ltime"
    timestamp_candidates:
      - "stime"
      - "timestamp"
      - "ltime"
      - "starttime"
    label_candidates:
      - "label"
      - "attack_cat"
    dst_port_candidates:
      - "dsport"
      - "dst_port"
      - "dport"
    field_mappings:
      duration_col: "dur"
      src_bytes_col: "sbytes"
      dst_bytes_col: "dbytes"
      src_pkts_col: "spkts"
      dst_pkts_col: "dpkts"
      src_iat_col: "sintpkt"
      dst_iat_col: "dintpkt"
      src_jitter_col: "sjit"
      dst_jitter_col: "djit"
      src_ttl_col: "sttl"
      dst_ttl_col: "dttl"
      src_win_col: "swin"
      dst_win_col: "dwin"
      state_col: "state"
      synack_col: "synack"
      ackdat_col: "ackdat"
      payload_len_col: "res_bdy_len"
      depth_col: "trans_depth"

  cic_ids2018:
    name: "CSE-CIC-IDS2018"
    aliases:
